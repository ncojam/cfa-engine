<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graveblood · Editors</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <button id="btnSidebar" class="icon-btn dlg-only" title="Показать/скрыть панель (Ctrl+B)">☰</button>
  <div class="brand">GRAVEBLOOD <span>editors</span></div>
  <nav id="tabs">
    <button class="tab" data-tab="dialogs" title="Редактор диалогов">💬 Диалоги</button>
    <button class="tab" data-tab="portraits" title="Портреты персонажей: что есть, что используется, что дорисовать">🖼 Портреты</button>
    <button class="tab" data-tab="tiles" title="Подмена тайлов на лету (fgtile, supertiles.cpp)">🧩 Подмена тайлов</button>
    <button class="tab" data-tab="groups" title="Группы персонажей: отношения между группами, состав, фразы групп">👥 Группы</button>
    <button class="tab" data-tab="people" title="Персонажи: ответы на Ask about, романтические профили">🧑‍🤝‍🧑 Персонажи</button>
    <button class="tab" data-tab="npc" title="Колесо взаимодействий с NPC: пункты, иконки, блокировка">🎛 NPC</button>
    <button class="tab" data-tab="missions" title="Порядок прохождения миссий (mission_order.cpp)">🗺 Миссии</button>
    <button class="tab" data-tab="light" title="Свет в помещениях и транспорте по времени суток (light_profiles.cpp)">💡 Свет</button>
  </nav>
  <div id="crumbs" class="dlg-only"></div>
  <div class="spacer"></div>
  <span id="issuesBadge" class="badge dlg-only" hidden></span>
  <button id="btnPlay" class="btn dlg-only" title="Прогнать текущий диалог">▶ Прогон</button>
  <button id="btnUndo" class="icon-btn dlg-only" title="Отменить (Ctrl+Z)">↶</button>
  <button id="btnRedo" class="icon-btn dlg-only" title="Повторить (Ctrl+Shift+Z)">↷</button>
  <button id="btnSettings" class="icon-btn" title="Настройки">⚙</button>
  <button id="btnReload" class="btn dlg-only" title="Перечитать файлы с диска">⟳ С диска</button>
  <button id="btnSave" class="btn primary dlg-only" title="Сохранить в dialogues.cpp/.h (Ctrl+S)">Сохранить</button>
</header>

<div id="layout">
  <aside id="sidebar">
    <div class="side-tools">
      <input id="search" type="search" placeholder="Поиск: текст, имя, d001_004…" autocomplete="off">
      <div class="chips" id="statusFilter">
        <button data-f="all" class="chip on">Все</button>
        <button data-f="wip" class="chip">● В работе</button>
        <button data-f="ok" class="chip">✓ OK</button>
        <button data-f="none" class="chip">○ Без статуса</button>
      </div>
    </div>
    <div id="tree"></div>
    <div class="side-foot">
      <button id="btnAddMission" class="btn small">+ миссия</button>
      <button id="btnCollapseAll" class="btn small ghost">свернуть всё</button>
    </div>
    <div id="sideResizer" title="Потяните, чтобы изменить ширину"></div>
  </aside>

  <main id="main">
    <div id="empty" class="empty">
      <div class="empty-title">Выберите диалог в дереве слева</div>
      <div class="empty-sub">Ctrl+S — сохранить · Ctrl+B — панель · Ctrl+Z — отмена · Alt+↑/↓ — соседний диалог</div>
    </div>
    <div id="editor" hidden></div>
    <div id="portraits" hidden></div>
    <div id="tiles" hidden></div>
    <div id="groups" hidden></div>
    <div id="people" hidden></div>
    <div id="npc" hidden></div>
    <div id="missions" hidden></div>
    <div id="light" hidden></div>
  </main>
</div>

<div id="popover" hidden></div>
<div id="modal" hidden><div class="modal-box"></div></div>
<div id="toasts"></div>

<script src="/static/gba.js"></script>
<script src="/static/app.js"></script>
<script src="/static/datatab.js"></script>
<script src="/static/portraits.js"></script>
<script src="/static/tiles.js"></script>
<script src="/static/groups.js"></script>
<script src="/static/npc.js"></script>
<script src="/static/people.js"></script>
<script src="/static/missions.js"></script>
<script src="/static/light.js"></script>
<script src="/static/tabs.js"></script>
</body>
</html>
